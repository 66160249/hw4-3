<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการตารางนัดหมาย</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>📅 เพิ่มนัดหมายใหม่</h2>
        <input id="title" type="text" placeholder="ชื่อเรื่อง" class="input-field">
        <input id="date" type="date" class="input-field">
        <input id="startTime" type="time" class="input-field">
        <input id="endTime" type="time" class="input-field">
        <button onclick="addAppointment()" class="btn">เพิ่มนัดหมาย</button>
        
        <h2>📋 รายการนัดหมาย</h2>
        <ul id="appointmentList"></ul>
    </div>
    
    <script src="function.js"></script>
</body>
</html>
