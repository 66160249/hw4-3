<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการตารางนัดหมาย</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="w-full max-w-lg bg-white shadow-lg rounded-lg p-6">
        <h2 class="text-2xl font-bold text-center text-blue-600 flex items-center justify-center gap-2">
            📅 เพิ่มนัดหมายใหม่
        </h2>

        <div class="mt-4 space-y-3">
            <input id="title" type="text" placeholder="ชื่อเรื่อง" class="input-field">
            <input id="date" type="date" class="input-field">
            <div class="flex gap-2">
                <input id="startTime" type="time" class="input-field w-1/2">
                <input id="endTime" type="time" class="input-field w-1/2">
            </div>
            <button onclick="addAppointment()" class="btn bg-blue-500 hover:bg-blue-700 w-full">เพิ่มนัดหมาย</button>
        </div>

        <h2 class="text-xl font-bold text-center text-gray-700 mt-6 flex items-center justify-center gap-2">
            📋 รายการนัดหมาย
        </h2>
        <ul id="appointmentList" class="mt-4 space-y-3"></ul>
    </div>

    <script src="function.js"></script>
</body>
</html>
